apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
  name: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
      - image: us-east1-docker.pkg.dev/mario-super-demo-496610/microarch-result/examplevotingapp_result:v1
        name: result
        ports:
        - containerPort: 80
          name: result
